      <stop offset="0" stop-color="#1F1F1F"/>
      <stop offset="1" stop-color="#0F0F0F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#FF0000" stop-opacity="0.18"/>
